<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avrupa Fuarlarındaki Türk Firmaları</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#667085;--line:#e4e7ec;--accent:#c8102e;--accent-soft:#fdecee;--ok:#067647;--ok-soft:#e7f6ee;--warn:#9a5b00;--warn-soft:#fff4e0}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 24px 14px;position:sticky;top:0;z-index:5}
h1{margin:0 0 4px;font-size:20px}
.sub{color:var(--muted);font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
#q{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
#q:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:20px;padding:20px 24px;max-width:1400px;margin:0 auto}
nav{position:sticky;top:130px;align-self:start;max-height:calc(100vh - 150px);overflow:auto}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 4px 6px}
.fair{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.fair:hover{background:#eef0f3}
.fair.on{background:var(--card);border-color:var(--line);box-shadow:0 1px 2px rgba(16,24,40,.06);font-weight:600}
.cnt{font-variant-numeric:tabular-nums;background:#eef0f3;border-radius:999px;padding:1px 8px;font-size:12px;color:var(--muted);font-weight:500}
.fair.on .cnt{background:var(--accent);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:20px;overflow:hidden}
.ph{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.ph h2{margin:0;font-size:18px}
.meta{color:var(--muted);font-size:13px;margin-top:3px}
.badge{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;margin-left:6px;vertical-align:2px;font-weight:600}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.note{font-size:12.5px;color:var(--warn);margin-top:6px}
.acts{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px;color:var(--ink);text-decoration:none}
.btn:hover{background:#f2f4f7}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 18px;border-bottom:1px solid #f0f1f3;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0}
td.n{color:var(--muted);width:44px;font-variant-numeric:tabular-nums}
td.st{white-space:nowrap;color:#344054;font-variant-numeric:tabular-nums}
tr:hover td{background:#fafbfc}
mark{background:#ffe58f;padding:0 1px;border-radius:2px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;padding:0 24px 30px;max-width:1400px;margin:0 auto}
@media(max-width:860px){.wrap{grid-template-columns:1fr}nav{position:static;max-height:none}header{position:static}}
</style>
</head>
<body>
<header>
  <h1>Avrupa Fuarlarına Katılan Türk Firmaları</h1>
  <div class="sub" id="sum"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Firma, şehir veya stand ara… (tüm fuarlarda)">
    <div id="chips"></div>
  </div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

const esc=s=>(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(s){ if(!q) return esc(s); const ns=norm(s), nq=norm(q); const i=ns.indexOf(nq); if(i<0) return esc(s); return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length)); }

function match(r){const n=norm(q);return !q||norm(r[0]).includes(n)||norm(r[1]).includes(n)||norm(r[2]).includes(n)}
function panel(f,rows){
  const ok=f.status==="2027 kayıtlı";
  return `<section class="panel" id="p-${f.id}"><div class="ph"><div>

}
